name: Publicar ALRIAN APP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do aplicativo
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Separar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          if [ -d public ]; then
            cp -R public/. _site/
          fi
          touch _site/.nojekyll

      - name: Enviar aplicativo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
