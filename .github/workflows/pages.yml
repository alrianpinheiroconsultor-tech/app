name: Publicar ALRIAN APP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ler arquivos
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar geração dos ícones
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar conversor de imagens
        run: python -m pip install CairoSVG==2.7.1

      - name: Preparar site e ícones PNG
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest _site/
          cp -R assets/. _site/assets/
          if [ -d public ]; then cp -R public/. _site/; fi
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          source = Path('assets/ap-icon-v2.svg')
          for size in (180, 192, 512):
              cairosvg.svg2png(
                  url=str(source),
                  write_to=f'_site/assets/ap-icon-v2-{size}.png',
                  output_width=size,
                  output_height=size,
              )
          PY

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
